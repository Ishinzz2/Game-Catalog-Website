name: CI

on:
  push:
    branches: [main, "fix/**", "chore/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner toolchain
        run: |
          php -r "if (PHP_VERSION_ID < 80300) { fwrite(STDERR, 'PHP 8.3+ is required'.PHP_EOL); exit(1); }"
          php -m | grep -qi '^pdo_sqlite$'
          php -m | grep -qi '^mbstring$'
          composer --version
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (!(major > 22 || (major === 22 && minor >= 12))) { console.error('Node.js 22.12+ is required'); process.exit(1); }"
          npm --version

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHP syntax checks
        run: find app bootstrap config database public routes tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run Laravel tests
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: php artisan test

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build
